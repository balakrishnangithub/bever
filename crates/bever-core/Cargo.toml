[package]
name = "bever-core"
description = "Local-first storage, ENEX, search, and sync engine for Bever"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
md5 = "0.7"
mime_guess = "2"
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.42", features = ["bundled", "collation", "fallible_uint"] }
rten = "0.26"
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

# Only for examples/pcloud_selftest.rs, which reads the token the application saved.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dev-dependencies]
keyring = { version = "3", features = ["windows-native"] }
