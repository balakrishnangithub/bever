[package]
name = "bever"
description = "Bever desktop and mobile application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bever_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mime_guess = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Opens picked files, including Android content:// URIs. No file-system
# command is granted to the WebView; see capabilities/default.json.
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }
bever-core = { path = "../crates/bever-core" }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Windows uses Credential Manager; this feature is target-gated by keyring.
keyring = { version = "3", features = ["windows-native"] }
tiny_http = "0.12"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
keyring-core = "1"
tauri-plugin-deep-link = "2.6.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Started a second time, Bever brings the one that is running to the front.
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
